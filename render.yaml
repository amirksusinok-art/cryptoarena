services:
  - type: web
    name: cryptoarena
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BOT_MODE
        value: webhook
      - key: APP_URL
        fromService:
          type: web
          name: cryptoarena
          property: host
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cryptoarena-db
          property: connectionString

databases:
  - name: cryptoarena-db
    plan: free
    region: frankfurt
    databaseName: cryptoarena
    user: cryptoarena_user
